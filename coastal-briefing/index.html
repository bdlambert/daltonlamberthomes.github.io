<title>Private Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a nautical-chart briefing. Deep channel-blue hero with a tide line, then a single reading column that widens for the analysis table. */
:root{
  --bg:#f2f6f5; --paper:#ffffff; --ink:#0e2433; --muted:#4d6470; --line:#d3e0e0;
  --deep:#0f3347; --deep-2:#16475f; --glass:#5c9e96; --glass-soft:#e1efec;
  --signal:#e39a2d; --signal-soft:#fbeed8; --warn:#c2532f; --warn-soft:#f8e3da; --ok:#2f7d5b; --ok-soft:#dff0e7;
  --on-deep:#eaf3f3; --on-deep-muted:#a9c6cc;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1922; --paper:#10242f; --ink:#e3eef0; --muted:#94aeb7; --line:#23404d;
  --deep:#081620; --deep-2:#0f2a38; --glass:#78bcb2; --glass-soft:#15343a;
  --signal:#f0ae4a; --signal-soft:#3a2c14; --warn:#e57a55; --warn-soft:#3b2019; --ok:#5fbf91; --ok-soft:#153427;
  --on-deep:#e3eef0; --on-deep-muted:#8fb0b9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1922; --paper:#10242f; --ink:#e3eef0; --muted:#94aeb7; --line:#23404d;
  --deep:#081620; --deep-2:#0f2a38; --glass:#78bcb2; --glass-soft:#15343a;
  --signal:#f0ae4a; --signal-soft:#3a2c14; --warn:#e57a55; --warn-soft:#3b2019; --ok:#5fbf91; --ok-soft:#153427;
  --on-deep:#e3eef0; --on-deep-muted:#8fb0b9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1.06rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:max(16px,4vw)}
h1,h2,h3,h4,h5{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
.num{white-space:nowrap}
.num,.meta,.coord,.eyebrow,.stamp,dt,.pill,.kind,th,.rv{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sel{user-select:all}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

/* updated bar */
.stamp{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;gap:.6rem;align-items:center;flex-wrap:wrap;
  background:var(--deep);color:var(--on-deep);font-size:.78rem;letter-spacing:.04em;padding:.55rem 16px;border-bottom:1px solid var(--deep-2)}
.stamp b{color:var(--signal);font-weight:500}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 var(--signal);animation:p 2.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* gate */
.gate{min-height:78vh;display:grid;place-items:center;background:linear-gradient(180deg,var(--deep),var(--deep-2));color:var(--on-deep);padding:3rem 16px}
.gate form{width:min(440px,100%);display:grid;gap:1rem}
.gate .eyebrow{color:var(--signal)}
.gate h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800}
.gate p{color:var(--on-deep-muted)}
.gate label{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-deep-muted)}
.gate .row{display:flex;gap:.5rem;flex-wrap:wrap}
.gate input{flex:1 1 200px;min-width:0;padding:.8rem 1rem;border-radius:10px;border:1px solid var(--deep-2);background:color-mix(in srgb,var(--deep) 70%,black);color:var(--on-deep);font:500 1rem var(--mono)}
.gate button{padding:.8rem 1.3rem;border-radius:10px;border:0;background:var(--signal);color:#1a1206;font-family:var(--display);font-weight:600}
.gate .err{color:var(--signal);min-height:1.4em;font-family:var(--mono);font-size:.85rem}

/* hero */
.hero{background:linear-gradient(180deg,var(--deep) 0%,var(--deep-2) 100%);color:var(--on-deep);position:relative;padding-top:clamp(2.5rem,7vw,5rem)}
.eyebrow{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
.hero h1{font-size:clamp(2.1rem,5.6vw,4.1rem);font-weight:800;letter-spacing:-.02em;margin-top:1rem;max-width:18ch}
.hero h1 em{font-style:normal;font-weight:400;color:var(--on-deep-muted);display:block}
.lede{margin-top:1.4rem;max-width:62ch;font-size:1.15rem;color:var(--on-deep)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1.4rem 1rem;margin:2.4rem 0 0;padding:1.2rem 1.3rem;background:var(--deep);border:1px solid color-mix(in srgb,var(--on-deep) 16%,transparent);border-radius:14px}
.stats div{min-width:0}
.stats dt{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--on-deep-muted)}
.stats dd{margin:.2rem 0 0;font:800 clamp(1.6rem,3.4vw,2.3rem)/1.1 var(--display);color:var(--on-deep)}
.tide{display:block;width:100%;height:70px;margin-top:2.6rem}
.tide path{fill:var(--glass);opacity:.35}
.tide .t2{fill:var(--bg);opacity:1}
@media (prefers-reduced-motion:no-preference){.tide path:first-child{animation:drift 9s ease-in-out infinite alternate}}
@keyframes drift{to{transform:translateX(-24px)}}

.toc{display:flex;gap:.4rem 1.2rem;flex-wrap:wrap;padding-block:1rem;font-family:var(--mono);font-size:.8rem}
.toc a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.toc a:hover{color:var(--ink);border-color:var(--signal)}

.sec{padding-block:clamp(2.5rem,6vw,4.5rem);border-top:1px solid var(--line)}
.sec h2{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:800;letter-spacing:-.01em}
.intro{margin-top:.8rem;max-width:66ch;color:var(--muted);font-size:1.08rem}
.fine{font-size:.9rem;color:var(--muted);margin-top:1rem}
ul.plain{margin:.5rem 0 0;padding-left:1.1rem;display:grid;gap:.35rem}

/* clients */
.clients{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:1.4rem;margin-top:2rem}
.client{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(1.2rem,3vw,1.8rem);min-width:0}
.coord{font-size:.72rem;color:var(--glass);letter-spacing:.08em}
.client h3{font-size:1.9rem;margin-top:.3rem}
.mkt{color:var(--muted)}
.status{margin-top:1rem;display:inline-flex;gap:.55rem;align-items:center;padding:.45rem .8rem;border-radius:999px;font-family:var(--mono);font-size:.82rem}
.status .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2rem;margin-top:1.3rem}
.split > div{min-width:0}
h5{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
ul.race{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.3rem}
ul.race li{display:flex;justify-content:space-between;gap:.8rem;border-bottom:1px dashed var(--line);padding-block:.25rem}

/* race chart */
.race-chart,.model{margin-top:1.8rem;display:grid;gap:.35rem}
.rb,.mb{display:grid;grid-template-columns:minmax(0,15rem) 1fr 5.5rem;gap:.8rem;align-items:center;font-size:.93rem}
.rl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb .rl{white-space:normal}
.mb .rl small{display:block;color:var(--muted);font-size:.78rem}
.rt{height:12px;background:var(--glass-soft);border-radius:6px;overflow:hidden}
.rf{display:block;height:100%;background:var(--glass);border-radius:6px}
.rv{text-align:right;font-size:.82rem;color:var(--muted)}
.rb.you .rl{font-weight:600;font-family:var(--display)}
.rb.you .rf{background:var(--signal)}
.rb.you.none .rf{background:repeating-linear-gradient(45deg,var(--warn-soft) 0 6px,transparent 6px 12px)}
.rb.you.none .rv{color:var(--warn)}
.mb .rf{background:var(--deep-2)}
@media (max-width:560px){.rb,.mb{grid-template-columns:1fr 4.8rem}.rb .rt,.mb .rt{grid-column:1/-1;order:3}}

/* common */
ol.common{list-style:none;counter-reset:c;padding:0;margin:2rem 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
ol.common li{background:var(--paper);padding:1.3rem 1.3rem 1.4rem;counter-increment:c;min-width:0}
ol.common h4{font-size:1.15rem}
ol.common h4::before{content:counter(c,decimal-leading-zero);display:block;font:500 .72rem var(--mono);color:var(--signal);letter-spacing:.1em;margin-bottom:.4rem}
ol.common p{margin-top:.45rem;font-size:.98rem;color:var(--muted)}

/* matrix */
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.6rem}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.35rem .85rem;font-family:var(--mono);font-size:.78rem}
.chip.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.tablewrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table.matrix{border-collapse:collapse;width:100%;min-width:1080px;font-size:.88rem}
.matrix th,.matrix td{padding:.65rem .75rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.matrix thead th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--paper)}
.matrix tbody th{font-family:var(--body);font-weight:400;min-width:12rem}
.matrix .co{display:block;font-family:var(--display);font-weight:600}
.matrix .tn{display:block;font-size:.78rem;color:var(--muted)}
.matrix .strong{font-weight:500;color:var(--ink)}
.matrix tr.mine{background:var(--signal-soft)}
.matrix tr.mine .co::after{content:" · you";font-family:var(--mono);font-size:.7rem;color:var(--signal)}
.pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-mid{background:var(--glass-soft);color:var(--glass)}
.st-warn{background:var(--warn-soft);color:var(--warn)} .st-none{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* library */
.folder{margin-top:2rem}
.folder header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:.5rem}
.folder header span{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
ul.docs{list-style:none;padding:0;margin:1rem 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:1rem}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.dh{display:flex;justify-content:space-between;gap:.5rem}
.kind{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--glass)}
.meta{font-size:.72rem;color:var(--muted)}
.doc h4{font-size:1.12rem}
.doc ul{font-size:.93rem;color:var(--muted);flex:1}
.onreq{margin-top:.4rem;font-family:var(--mono);font-size:.74rem;color:var(--glass)}
.open{align-self:flex-start;margin-top:.4rem;border:0;border-radius:9px;background:var(--deep);color:var(--on-deep);padding:.55rem 1rem;font-family:var(--display);font-weight:600}
.open:hover{background:var(--deep-2)}
.pending{margin-top:2rem;padding:1.1rem 1.3rem;border:1px dashed var(--line);border-radius:14px}
.pending h4{font-size:1rem}

/* recs */
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:2rem;margin-top:2rem}
.recs > div{min-width:0}
.recs h3{font-size:1.6rem;padding-bottom:.6rem;border-bottom:2px solid var(--signal)}
.recs ol{padding-left:1.4rem;margin:1rem 0 0;display:grid;gap:1.1rem}
.recs li::marker{font-family:var(--mono);color:var(--signal)}
.recs h4{font-size:1.08rem}
.recs p{margin-top:.3rem;color:var(--muted);font-size:.98rem}

.about{padding-bottom:5rem}
.about > p{max-width:62ch;margin-top:1rem;font-size:1.12rem}
.sig{font-family:var(--display);font-weight:600}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--deep) 88%,black);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex;align-items:center;gap:1rem;justify-content:space-between;padding:.7rem 16px;color:var(--on-deep);font-family:var(--mono);font-size:.82rem}
.vbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vbar button{border:1px solid var(--on-deep-muted);background:transparent;color:var(--on-deep);border-radius:8px;padding:.4rem .9rem;flex:none}
.pages{flex:1;overflow:auto;padding:0 16px 3rem;display:flex;flex-direction:column;align-items:center;gap:14px}
.pages canvas{max-width:min(900px,100%);height:auto;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35);border-radius:3px}
.pages .msg{color:var(--on-deep);font-family:var(--mono);padding:2rem}
</style>

let DOCS = {}, KEY = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BLOB.s), iterations:BLOB.n||250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.i)}, key, b64(BLOB.c));
  KEY = key;
  return JSON.parse(new TextDecoder().decode(pt));
}

function wire(){
  const chips = document.querySelectorAll(".chip");
  chips.forEach(ch => ch.addEventListener("click", () => {
    chips.forEach(c => c.classList.toggle("on", c === ch));
    const f = ch.dataset.f;
    document.querySelectorAll(".matrix tbody tr").forEach(tr => {
      const show = f === "all" || tr.classList.contains("mine") || (f === "terms" ? tr.dataset.st === "Shared terms" : tr.dataset.region === f);
      tr.hidden = !show;
    });
  }));
  document.querySelectorAll(".open").forEach(b => b.addEventListener("click", () => openDoc(b.dataset.doc, b.dataset.title)));
}

async function openDoc(id, title){
  const v = document.getElementById("viewer"), pages = document.getElementById("pages");
  document.getElementById("vtitle").textContent = title;
  pages.innerHTML = '<p class="msg">Opening…</p>';
  v.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("vclose").focus();
  try{
    if(!window.pdfjsLib) throw new Error('viewer library not loaded');
    const res = await fetch(`d/${DOCS[id]}.bin`, {cache:"force-cache"});
    if(!res.ok) throw new Error("document not found");
    const buf = new Uint8Array(await res.arrayBuffer());
    const bytes = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(0,12)}, KEY, buf.slice(12)));
    const pdf = await pdfjsLib.getDocument({data: bytes, isEvalSupported:false}).promise;
    pages.innerHTML = "";
    const w = Math.min(900, pages.clientWidth - 32);
    for(let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const vp1 = page.getViewport({scale:1});
      const scale = (w / vp1.width) * Math.min(2, window.devicePixelRatio || 1);
      const vp = page.getViewport({scale});
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height; c.setAttribute("aria-label", `Page ${n} of ${pdf.numPages}`);
      pages.appendChild(c);
      await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    }
  }catch(e){
    pages.innerHTML = '<p class="msg">This document could not be displayed on this device. Try again on a desktop browser.</p>';
    console.error(e);
  }
}
function closeDoc(){ document.getElementById("viewer").hidden = true; document.body.style.overflow = ""; document.getElementById("pages").innerHTML = ""; }
document.getElementById("vclose").addEventListener("click", closeDoc);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("viewer").hidden) closeDoc(); });

document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Opening…";
  try{
    const data = await unlock(pw);
    DOCS = data.docs;
    document.getElementById("app").innerHTML = data.html;
    document.getElementById("gate").remove();
    wire();
    try{ sessionStorage.setItem("cmb", pw); }catch(_){}
  }catch(_){
    err.textContent = "That password didn't work. Check it and try again.";
    go.disabled = false; go.textContent = "Open briefing";
  }
});
try{ const saved = sessionStorage.getItem("cmb"); if(saved){ document.getElementById("pw").value = saved; document.getElementById("gateForm").requestSubmit(); } }catch(_){}
</script>
